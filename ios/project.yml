name: BatMonitor
options:
  bundleIdPrefix: com.andyechc
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 3PUM2552T9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  BatMonitor:
    type: application
    platform: iOS
    sources:
      - path: BatMonitor
    info:
      path: BatMonitor/Info.plist
      properties:
        CFBundleDisplayName: BatMonitor
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: BatMonitor usa Bluetooth para leer el BMS de tu batería.
        UIAppFonts: [MPLUS1p-ExtraBold.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andyechc.batmonitor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: NO
  BatMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BatMonitorTests
    dependencies:
      - target: BatMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  BatMonitorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BatMonitorUITests
    dependencies:
      - target: BatMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BatMonitor:
    build:
      targets:
        BatMonitor: all
        BatMonitorTests: [test]
    test:
      targets:
        - BatMonitorTests
        - BatMonitorUITests
